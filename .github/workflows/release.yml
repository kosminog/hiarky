name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package.json version $PKG" >&2
            exit 1
          fi

      - run: npm ci

      - name: Environment
        run: |
          echo "npm  $(npm -v)"
          echo "node $(node -v)"
          echo "NODE_AUTH_TOKEN is ${NODE_AUTH_TOKEN:+set}${NODE_AUTH_TOKEN:-unset}"
          echo "--- .npmrc files ---"
          cat "$NPM_CONFIG_USERCONFIG" 2>/dev/null || echo "(no user .npmrc)"
          cat .npmrc 2>/dev/null || echo "(no project .npmrc)"

      # prepublishOnly runs typecheck, the test suite, and a clean build.
      - run: npm publish --provenance --access public
